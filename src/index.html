<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Fun Trivia</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- START SCREEN -->
  <main id="screen-start" class="screen active">
    <header class="start-header">
      <h1 data-i18n="app.title">Fun Trivia</h1>
      <button id="btn-language" class="btn-icon" aria-label="Change language">
        <span id="current-lang">EN</span>
      </button>
    </header>

    <section class="player-setup">
      <label data-i18n="app.players">Number of Players</label>
      <div class="player-count-selector">
        <button class="btn-count" data-count="1">1</button>
        <button class="btn-count active" data-count="2">2</button>
        <button class="btn-count" data-count="3">3</button>
        <button class="btn-count" data-count="4">4</button>
      </div>

      <div id="player-names" class="player-names">
        <!-- Generated dynamically -->
      </div>

      <label data-i18n="app.rounds">Rounds</label>
      <div class="round-count-selector">
        <button class="btn-count active" data-rounds="1">1</button>
        <button class="btn-count" data-rounds="3">3</button>
        <button class="btn-count" data-rounds="5">5</button>
      </div>
    </section>

    <button id="btn-start" class="btn-primary" data-i18n="app.start">
      Start Game
    </button>
  </main>

  <!-- GAME SCREEN -->
  <main id="screen-game" class="screen">
    <header class="game-header">
      <span id="question-counter" class="question-counter">1/10</span>
      <div id="scores" class="scores">
        <!-- Generated dynamically -->
      </div>
    </header>

    <section id="answers-area" class="answers-area layout-2">
      <!-- Player zones - positioned via CSS grid based on layout-N class -->
      <div id="zone-0" class="player-zone">
        <div class="zone-content">
          <div class="zone-header">
            <span class="zone-player-name"></span>
            <span class="zone-cups"></span>
            <span class="zone-score">0</span>
          </div>
          <p class="zone-question zone-question-0"></p>
          <div class="zone-answers">
            <button class="btn-answer" data-player="0" data-answer="0"></button>
            <button class="btn-answer" data-player="0" data-answer="1"></button>
            <button class="btn-answer" data-player="0" data-answer="2"></button>
            <button class="btn-answer" data-player="0" data-answer="3"></button>
          </div>
        </div>
      </div>
      <div id="zone-1" class="player-zone">
        <div class="zone-content">
          <div class="zone-header">
            <span class="zone-player-name"></span>
            <span class="zone-cups"></span>
            <span class="zone-score">0</span>
          </div>
          <p class="zone-question zone-question-1"></p>
          <div class="zone-answers">
            <button class="btn-answer" data-player="1" data-answer="0"></button>
            <button class="btn-answer" data-player="1" data-answer="1"></button>
            <button class="btn-answer" data-player="1" data-answer="2"></button>
            <button class="btn-answer" data-player="1" data-answer="3"></button>
          </div>
        </div>
      </div>
      <div id="zone-2" class="player-zone">
        <div class="zone-content">
          <div class="zone-header">
            <span class="zone-player-name"></span>
            <span class="zone-cups"></span>
            <span class="zone-score">0</span>
          </div>
          <p class="zone-question zone-question-2"></p>
          <div class="zone-answers">
            <button class="btn-answer" data-player="2" data-answer="0"></button>
            <button class="btn-answer" data-player="2" data-answer="1"></button>
            <button class="btn-answer" data-player="2" data-answer="2"></button>
            <button class="btn-answer" data-player="2" data-answer="3"></button>
          </div>
        </div>
      </div>
      <div id="zone-3" class="player-zone">
        <div class="zone-content">
          <div class="zone-header">
            <span class="zone-player-name"></span>
            <span class="zone-cups"></span>
            <span class="zone-score">0</span>
          </div>
          <p class="zone-question zone-question-3"></p>
          <div class="zone-answers">
            <button class="btn-answer" data-player="3" data-answer="0"></button>
            <button class="btn-answer" data-player="3" data-answer="1"></button>
            <button class="btn-answer" data-player="3" data-answer="2"></button>
            <button class="btn-answer" data-player="3" data-answer="3"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- RESULTS SCREEN -->
  <main id="screen-results" class="screen">
    <div id="confetti-container" class="confetti-container"></div>

    <section class="results-content">
      <h2 id="winner-text" class="winner-text" data-i18n="app.winner">
        Player wins!
      </h2>

      <div id="final-scores" class="final-scores">
        <!-- Generated dynamically -->
      </div>

      <button id="btn-play-again" class="btn-primary" data-i18n="app.playAgain">
        Play Again
      </button>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/typography.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
